<div class="login-page">
  <div class="login-card">
    <div class="login-card__icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1 class="login-card__title">Welcome back</h1>
    <p class="login-card__subtitle">Sign in to continue</p>

    <form class="login-form" (ngSubmit)="submit()" #f="ngForm">
      <div class="login-form__field">
        <label for="userId">User ID</label>
        <input
          id="userId"
          type="text"
          [(ngModel)]="id"
          name="id"
          placeholder="Enter your user ID"
          autocomplete="username"
          required
          [disabled]="loading()"
        />
      </div>

      <div class="login-form__field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
          [disabled]="loading()"
        />
      </div>

      @if (error()) {
        <p class="login-form__error">{{ error() }}</p>
      }

      <button type="submit" class="login-form__submit" [class.loading]="loading()" [disabled]="loading() || !id || !password">
        @if (loading()) {
          <span class="login-form__spinner"></span>
        } @else {
          Sign in
        }
      </button>
    </form>
  </div>
</div>
